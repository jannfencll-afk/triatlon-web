<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triathlon Hub - Registrace</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HLAVIČKA A MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-stopwatch-fill text-warning me-2"></i>TRIATHLON HUB
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hlavniNavigace">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="hlavniNavigace">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Úvod</a></li>
          <li class="nav-item"><a class="nav-link" href="discipliny.html"><i class="bi bi-water me-1"></i>Disciplíny</a></li>
          <li class="nav-item"><a class="nav-link" href="vysledky.html"><i class="bi bi-trophy me-1"></i>Výsledky</a></li>
          <li class="nav-item"><a class="nav-link active" href="registrace.html"><i class="bi bi-pencil-square me-1"></i>Registrace</a></li>
          <li class="nav-item"><a class="nav-link" href="kontakt.html"><i class="bi bi-envelope me-1"></i>Kontakt</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- DROBEČKOVÁ NAVIGACE -->
  <div class="bg-white border-bottom py-2">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Domů</a></li>
          <li class="breadcrumb-item active" aria-current="page">Registrace</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- OBSAH STRÁNKY -->
  <main class="container my-5 flex-grow-1">
    <section class="bg-white p-4 p-md-5 rounded shadow-sm">
      <h1 class="h2 fw-bold mb-4"><i class="bi bi-ui-checks-grid text-success me-2"></i>Registrační formulář závodníka</h1>
      
      <form class="row g-3">
        <!-- 1. Text s Input Group -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Jméno a příjmení *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" placeholder="Jan Novák" required>
          </div>
        </div>

        <!-- 2. Email s Input Group -->
        <div class="col-md-6">
          <label class="form-label fw-bold">E-mailová adresa *</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="novak@email.cz" required>
          </div>
        </div>

        <!-- 3. Telefon -->
        <div class="col-md-4">
          <label class="form-label fw-bold">Telefonní číslo</label>
          <input type="tel" class="form-control" placeholder="+420 777 123 456">
        </div>

        <!-- 4. Datum narození -->
        <div class="col-md-4">
          <label class="form-label fw-bold">Datum narození *</label>
          <input type="date" class="form-control" required>
        </div>

        <!-- 5. Select / Option -->
        <div class="col-md-4">
          <label class="form-label fw-bold">Závodní distance *</label>
          <select class="form-select" required>
            <option value="" selected disabled>Vyberte závod...</option>
            <option value="sprint">Sprint Triatlon (0,75 - 20 - 5 km)</option>
            <option value="olymp">Olympijský Triatlon (1,5 - 40 - 10 km)</option>
            <option value="half">Half Ironman / 70.3 (1,9 - 90 - 21,1 km)</option>
            <option value="full">Ironman (3,8 - 180 - 42,2 km)</option>
          </select>
        </div>

        <!-- 6. Text -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Sportovní klub / Tým</label>
          <input type="text" class="form-control" placeholder="TJ Přerov / Individuální">
        </div>

        <!-- 7. Text -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Odhadovaný plavecký čas na 100m</label>
          <input type="text" class="form-control" placeholder="např. 1:45 min/100m">
        </div>

        <!-- 8. Radio -->
        <div class="col-md-6">
          <label class="form-label fw-bold d-block">Pohlaví *</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genderOptions" id="genderM" value="M" checked>
            <label class="form-check-label" for="genderM">Muž</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genderOptions" id="genderZ" value="Z">
            <label class="form-check-label" for="genderZ">Žena</label>
          </div>
        </div>

        <!-- 9. Select / Option -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Velikost pamětního funkčního trička</label>
          <select class="form-select">
            <option value="S">Velikost S</option>
            <option value="M" selected>Velikost M</option>
            <option value="L">Velikost L</option>
            <option value="XL">Velikost XL</option>
          </select>
        </div>

        <!-- 10. Textarea -->
        <div class="col-12">
          <label class="form-label fw-bold">Zdravotní omezení, alergie nebo poznámka pro pořadatele</label>
          <textarea class="form-control" rows="3" placeholder="Zde uveďte případné léky, alergie nebo kontaktní osobu..."></textarea>
        </div>

        <!-- 11. Checkbox -->
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="souhlas" required>
            <label class="form-check-label small" for="souhlas">
              Prohlašuji, že startuji na vlastní nebezpečí, jsem zdravotně způsobilý/á a souhlasím s pravidly závodu. *
            </label>
          </div>
        </div>

        <!-- Tlačítko Uložit (Save) -->
        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-success btn-lg px-4 shadow">
            <i class="bi bi-check-circle-fill me-2"></i>Uložit (Save)
          </button>
          <button type="reset" class="btn btn-outline-secondary btn-lg ms-2">Vymazat formulář</button>
        </div>
      </form>
    </section>
  </main>

  <!-- PATIČKA -->
  <footer class="bg-dark text-white py-4 mt-auto border-top border-secondary">
    <div class="container text-center">
      <p class="mb-1 fw-bold">TRIATHLON HUB © 2026</p>
      <p class="small text-muted mb-0">Semestrální projekt pro responzivní webdesign v Bootstrapu 5</p>
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
